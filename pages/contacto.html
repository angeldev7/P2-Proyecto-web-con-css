<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - FastMenu ESPE</title>
    <link rel="icon" type="image/x-icon" href="../imagenes/logo/iconos/atencion-al-cliente.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../css/general.css">
    <link rel="stylesheet" href="../css/contacto.css">
</head>

<body>

    <header>
        <h1>Contáctanos</h1>
        <img src="../imagenes/logo/iconos/atencion-al-cliente.ico" alt="Icono Atención" width="60">
    </header>

    <nav>
        <ul>
            <li>
                <a href="principal.html"><i class="fas fa-home"></i> Inicio</a>
            </li>
            <li>
                <a href="pedido.html"><i class="fas fa-shopping-cart"></i> Mi pedido</a>
            </li>
            <li>
                <a href="nosotros.html"><i class="fas fa-users"></i> Nosotros</a>
            </li>
            <li>
                <a href="contacto.html"><i class="fas fa-envelope"></i> Contacto</a>
            </li>
            <li>
                <a href="../index.html"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a>
            </li>
        </ul>
    </nav>

    <main>

        <section id="buzon-sugerencias">
            <h2>Buzón de Sugerencias</h2>
            <p>¿Tienes algún problema con un pedido o nos quieres sugerir un nuevo platillo? ¡Escríbenos!</p>

            <form class="formulario-contacto" action="principal.html" method="get">
                <p>
                    <label for="asunto">Asunto:</label>
                    <input type="text" id="asunto" name="asunto" required placeholder="Ej: Sugerencia de menú">
                </p>

                <p>
                    <label for="telefono">Teléfono (Opcional):</label>
                    <input type="tel" id="telefono" name="telefono" placeholder="0999999999" pattern="[0-9]{10}">
                </p>

                <p>
                    <label>Tipo de mensaje:</label>
                    <span class="radio-group">
                        <span>
                            <input type="radio" id="tipo_reclamo" name="tipo_mensaje" value="reclamo" required>
                            <label for="tipo_reclamo">Reclamo</label>
                        </span>
                        <span>
                            <input type="radio" id="tipo_sugerencia" name="tipo_mensaje" value="sugerencia">
                            <label for="tipo_sugerencia">Sugerencia</label>
                        </span>
                        <span>
                            <input type="radio" id="tipo_otros" name="tipo_mensaje" value="otros">
                            <label for="tipo_otros">Otros</label>
                        </span>
                    </span>
                </p>

                <p>
                    <label for="mensaje">Tu mensaje:</label>
                    <textarea id="mensaje" name="mensaje" rows="5" required
                        placeholder="Escribe aquí los detalles..."></textarea>
                </p>

                <button type="submit" class="btn-enviar">Enviar Mensaje</button>
            </form>
        </section>

    </main>

    <footer>
        <p>Copyright &copy; 2026 FastMenu ESPE. Todos los derechos reservados.</p>
    </footer>

</body>

</html>
