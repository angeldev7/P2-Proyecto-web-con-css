<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - FastMenu ESPE</title>
    <link rel="icon" type="image/x-icon" href="../imagenes/logo/iconos/Icono-FastMenu.ico">
    <link rel="stylesheet" href="../css/general.css">
    <link rel="stylesheet" href="../css/registro.css">
</head>

<body>

    <header>
        <h1>Formulario de Registro</h1>
    </header>

    <main>
        <section id="formulario-registro">
            <p>Completa tus datos para disfrutar de nuestros beneficios.</p>
            <form action="principal.html" method="get">

                <fieldset>
                    <legend>Datos Personales</legend>
                    <p>
                        <label for="nombres">Nombres:</label>
                        <input type="text" id="nombres" name="nombres" required placeholder="Ej: Juan Carlos">
                    </p>
                    <p>
                        <label for="apellidos">Apellidos:</label>
                        <input type="text" id="apellidos" name="apellidos" required placeholder="Ej: Pérez Gómez">
                    </p>
                    <p>
                        <label for="cedula">Cédula:</label>
                        <input type="text" id="cedula" name="cedula" maxlength="10" required placeholder="1700000000">
                    </p>
                    <p>
                        <label for="fecha_nacimiento">Fecha de Nacimiento:</label>
                        <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required>
                    </p>
                    <p>
                        <label for="genero">Género:</label>
                        <select id="genero" name="genero" required>
                            <option value="">-- Selecciona --</option>
                            <option value="masculino">Masculino</option>
                            <option value="femenino">Femenino</option>
                            <option value="otro">Otro</option>
                        </select>
                    </p>
                </fieldset>

                <fieldset>
                    <legend>Datos de Cuenta</legend>
                    <p>
                        <label for="email">Correo Electrónico Institucional:</label>
                        <input type="email" id="email" name="email" required placeholder="usuario@espe.edu.ec">
                    </p>
                    <p>
                        <label for="password">Contraseña:</label>
                        <input type="password" id="password" name="password" minlength="8" maxlength="16" required
                            placeholder="Mínimo 8 caracteres">
                    </p>
                    <p>
                        <label>
                            <input type="checkbox" required name="terminos"> Acepto los <a href="#">términos y
                                condiciones</a>
                        </label>
                    </p>
                </fieldset>

                <button type="submit">Completar Registro</button>
            </form>
        </section>

        <section id="login-link">
            <p>¿Ya tienes una cuenta? <a href="../index.html">Inicia Sesión aquí</a></p>
        </section>
    </main>

    <footer>
        <p>Copyright © 2026 FastMenu ESPE. Todos los derechos reservados.</p>
    </footer>

</body>

</html>
