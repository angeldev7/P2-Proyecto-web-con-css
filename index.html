<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión - FastMenu ESPE</title>
    <link rel="icon" type="image/x-icon" href="imagenes/logo/iconos/Icono-FastMenu.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="css/general.css">
    <link rel="stylesheet" href="css/index.css">
</head>

<body>

    <header>
        <h1>Inicio de Sesión</h1>
    </header>

    <main>
        <section id="login-form">
            <img src="imagenes/logo/fastfood-logo.jpg" alt="Logo de FastMenu ESPE" width="120">

            <p>¡Pide tu comida sin hacer filas en la universidad!</p>

            <form action="pages/principal.html" method="get">
                <p>
                    <label for="usuario">Usuario o Correo:</label>
                    <input type="text" id="usuario" name="usuario" required
                        placeholder="Ej: abperez o usuario@espe.edu.ec">
                </p>
                <p>
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" minlength="8" maxlength="16" required
                        placeholder="********">
                </p>
                <div>
                    <label><input type="checkbox" name="recordarme"> Recordarme</label>
                    <a href="#">¿Olvidaste tu clave?</a>
                </div>
                <button type="submit" class="btn-ingresar">Ingresar</button>
            </form>
        </section>

        <section id="registro-link">
            <p>¿No tienes una cuenta? <a href="pages/registro.html">Regístrate aquí</a></p>
        </section>
    </main>

    <footer>
        <p>Copyright © 2026 FastMenu ESPE. Todos los derechos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>

</html>
