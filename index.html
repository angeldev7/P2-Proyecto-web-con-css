<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión - FastMenu ESPE</title>
    <link rel="icon" type="image/x-icon" href="imagenes/logo/iconos/Icono-FastMenu.ico">
</head>
<body style="font-family: Arial, sans-serif; background-color: #f8f9fa; margin: 0; padding: 0; color: #333; display: flex; flex-direction: column; min-height: 100vh;">

    <header style="background-color: darkred; color: white; text-align: center; padding: 20px 0;">
        <h1 style="margin: 0;">Inicio de Sesión</h1>
    </header>

    <main style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px;">
        <section id="login-form" style="background-color: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center;">
            <img src="imagenes/logo/fastfood-logo.jpg" alt="Logo de FastMenu ESPE" width="120" style="border-radius: 10px; margin-bottom: 10px; border: 2px solid darkred;">
            
            <p style="color: #666; font-size: 0.95em; margin-top: 0; margin-bottom: 20px;">¡Pide tu comida sin hacer filas en la universidad!</p>

            <form action="pages/principal.html" method="get" style="text-align: left;">
                <p style="margin-bottom: 15px;">
                    <label for="usuario" style="font-weight: bold; display: block; margin-bottom: 5px;">Usuario o Correo:</label>
                    <input type="text" id="usuario" name="usuario" required placeholder="Ej: abperez o usuario@espe.edu.ec" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
                </p>
                <p style="margin-bottom: 15px;">
                    <label for="password" style="font-weight: bold; display: block; margin-bottom: 5px;">Contraseña:</label>
                    <input type="password" id="password" name="password" minlength="8" maxlength="16" required placeholder="********" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
                </p>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 0.9em;">
                    <label style="cursor: pointer; color: #555;"><input type="checkbox" name="recordarme"> Recordarme</label>
                    <a href="#" style="color: darkred; text-decoration: none; font-weight: bold;">¿Olvidaste tu clave?</a>
                </div>
                <button type="submit" style="background-color: darkred; color: white; border: none; padding: 12px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 1.1em; font-weight: bold;">Ingresar</button>
            </form>
        </section>
        
        <section id="registro-link" style="margin-top: 20px; text-align: center;">
            <p>¿No tienes una cuenta? <a href="pages/registro.html" style="color: darkred; font-weight: bold; text-decoration: none;">Regístrate aquí</a></p>
        </section>
    </main>

    <footer style="background-color: #333; color: white; text-align: center; padding: 15px 0; width: 100%;">
        <p style="margin: 0;">Copyright © 2026 FastMenu ESPE. Todos los derechos reservados.</p>
    </footer>

</body>

</html>
